<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>AWS Pre-Meeting Discovery</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
:root{--bg:#f8f9fa;--surface:#fff;--text:#172b4d;--text2:#44546f;--muted:#8993a4;--border:#dfe1e6;--border-light:#ebecf0;--orange:#FF9900;--orange-dark:#e68a00;--navy:#232f3e;--r-md:8px;--r-pill:100px;--font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}

/* NAV */
.top-nav{background:var(--navy);padding:11px 24px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.top-nav .logo{font-weight:700;font-size:15px;color:var(--orange);display:flex;align-items:center;gap:7px}
.top-nav .title{font-size:13px;color:rgba(255,255,255,.6);flex:1}

/* CHAT */
.chat-body{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:28px 16px 0;background:linear-gradient(160deg,#fff8ef 0%,var(--bg) 50%);overflow-y:auto}
.chat-wrap{width:100%;max-width:560px;display:flex;flex-direction:column}
.chat-header{text-align:center;margin-bottom:20px}
.chat-header .av{width:50px;height:50px;background:linear-gradient(135deg,var(--orange),#e05c00);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 11px;color:#fff;font-size:22px}
.chat-header h2{font-size:16px;font-weight:700;margin-bottom:3px}
.chat-header p{font-size:13px;color:var(--muted)}
.prog-row{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:5px}
.prog-bg{background:var(--border-light);border-radius:4px;height:4px;margin-bottom:14px;overflow:hidden}
.prog-fill{background:var(--orange);height:100%;border-radius:4px;transition:width .4s;width:0}
.chat-msgs{display:flex;flex-direction:column;gap:10px;margin-bottom:14px;min-height:160px}
.msg{display:flex;gap:8px;align-items:flex-start;max-width:86%;opacity:0;transform:translateY(6px);animation:msgIn .28s ease forwards}
@keyframes msgIn{to{opacity:1;transform:translateY(0)}}
.msg.bot{align-self:flex-start}.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg .bubble{padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.55}
.msg.bot .bubble{background:var(--surface);border:1px solid var(--border-light);border-top-left-radius:3px}
.msg.user .bubble{background:var(--orange);color:#fff;border-top-right-radius:3px}
.msg .ico{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px}
.msg.bot .ico{background:linear-gradient(135deg,var(--orange),#e05c00);color:#fff}
.msg.user .ico{background:var(--navy);color:#fff}
.typing-wrap{display:flex;gap:8px;align-items:flex-start;margin-bottom:10px}
.typing-dots{display:flex;align-items:center;gap:4px;padding:10px 14px;background:var(--surface);border:1px solid var(--border-light);border-radius:12px;border-top-left-radius:3px}
.typing-dots span{width:6px;height:6px;background:var(--muted);border-radius:50%;animation:td 1.2s infinite}
.typing-dots span:nth-child(2){animation-delay:.2s}.typing-dots span:nth-child(3){animation-delay:.4s}
@keyframes td{0%,60%,100%{opacity:.3;transform:scale(.8)}30%{opacity:1;transform:scale(1)}}
.choices{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.ch-btn{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r-pill);padding:8px 16px;font-size:13px;cursor:pointer;color:var(--text);transition:border-color .15s,background .15s}
.ch-btn:hover{border-color:var(--orange);background:#fff8ee}
.ch-btn.sel{border-color:var(--orange);background:var(--orange);color:#fff}
.ch-hint{width:100%;font-size:11px;color:var(--muted);margin-bottom:2px}
.input-row{display:flex;gap:8px;margin-bottom:8px;position:sticky;bottom:0;background:linear-gradient(0deg,#fff8ef 60%,transparent 100%);padding-top:10px}
.input-row input{flex:1;padding:10px 14px;border:1.5px solid var(--border);border-radius:var(--r-pill);font-size:13px;outline:none;color:var(--text);background:var(--surface)}
.input-row input:focus{border-color:var(--orange)}
.input-row input:disabled{background:#f5f5f5;color:var(--muted);cursor:not-allowed}
.input-row button{width:36px;height:36px;border-radius:50%;border:none;background:var(--orange);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.input-row button:hover{background:var(--orange-dark)}
.input-row button:disabled{background:var(--border);cursor:not-allowed}
.skip-link{text-align:center;font-size:12px;color:var(--muted);padding-bottom:20px}
.skip-link a{color:var(--text2);text-decoration:underline;cursor:pointer}
.res-cards{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;animation:msgIn .28s ease forwards;opacity:0}
.res-card{background:var(--surface);border:1.5px solid var(--border-light);border-radius:var(--r-md);padding:11px 14px;display:flex;align-items:flex-start;gap:12px;text-decoration:none;color:var(--text);transition:border-color .15s}
.res-card:hover{border-color:var(--orange)}
.res-card .ri{width:34px;height:34px;border-radius:var(--r-md);background:#fff4e0;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--orange);font-size:14px}
.res-card .rb{flex:1;min-width:0}
.res-card .rl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--orange);margin-bottom:2px}
.res-card .rt{font-size:13px;font-weight:600;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res-card .rd{font-size:12px;color:var(--muted);line-height:1.4}
.res-card .ra{color:var(--muted);font-size:12px;margin-top:2px;flex-shrink:0}
</style>
</head>
<body>

<nav class="top-nav">
  <div class="logo"><i class="fa-brands fa-aws"></i> AWS</div>
  <div class="title">Pre-Meeting Discovery</div>
</nav>

<div class="chat-body">
  <div class="chat-wrap">
    <div class="chat-header">
      <div class="av"><i class="fa-brands fa-aws"></i></div>
      <h2>Meeting Preparation</h2>
      <p>A few quick questions to tailor your meeting</p>
    </div>
    <div class="prog-row"><span id="prog-label">Ready to start</span><span id="prog-count"></span></div>
    <div class="prog-bg"><div class="prog-fill" id="prog-fill"></div></div>
    <div class="chat-msgs" id="chat-msgs"></div>
    <div id="choices" class="choices" style="display:none"></div>
    <div class="input-row" id="input-row" style="display:none">
      <input id="text-in" type="text" placeholder="Type here..."/>
      <button id="send-btn" onclick="submitText()"><i class="fa-solid fa-arrow-up"></i></button>
    </div>
    <div class="skip-link" id="skip-link"><a onclick="doSkip()">Skip</a></div>
  </div>
</div>

<script>
// ═══ STATE ═══
const answers = {}; let current = 0, multiSel = [], skipped = false;

// ═══ QUESTIONS ═══
// Order: Welcome → Q1 (intent) → Q2 (adaptive) → Q3 (focus) → Q4 (timeline) → Q5 (attendees)

const Q2B = {
  "We're evaluating alternatives to our current infrastructure":{q:"What does your current infrastructure look like?",opts:["Mostly on-premises","Microsoft Azure","Google Cloud","A mix of providers","Not sure","Other"]},
  "We have a specific project or problem to solve":{q:"What kind of project or problem are we solving?",opts:["App or website","Data & analytics","Security or compliance","Cost reduction","Infrastructure modernisation","Other"]},
  "We're curious about AI and what's possible":{q:"Where are you at with AI right now?",opts:["Just curious — exploring the space","We have a specific idea in mind","Already experimenting, want guidance","Something running — want to scale it","Other"]}
};

const ACKS_AFTER = {
  welcome: "Great — let's get started.",
  intent: null,
  onaws: "Noted.",
  context: "Helpful context.",
  focus: "Last one.",
};
const INTENT_ACKS = {
  "We want to explore how AWS fits into our business": "Got it. A few more to help us tailor things.",
  "We're evaluating alternatives to our current infrastructure": "Understood.",
  "We have a specific project or problem to solve": "Let's dig into that.",
  "We're curious about AI and what's possible": "Good one — AI is moving fast.",
  "Honestly, not sure yet — open to learning": "No problem — that's what the meeting is for.",
};

const QS = [
  {id:'welcome',bot:"Hello! Thank you for booking a meeting with us.\n\nYou're welcome to answer a few quick questions. It helps us prepare in the best way possible, and you'll receive tailored resources ahead of the meeting so you can explore what matters most to you beforehand.\n\nEntirely optional — feel free to skip if you'd prefer to dive in live.",type:'choice',opts:["Sure, let's do it","I'll share my priorities in the meeting"],key:'welcome'},
  {id:'intent',bot:"What's the main topic you'd like to discuss in the meeting?",type:'choice',opts:["We want to explore how AWS fits into our business","We're evaluating alternatives to our current infrastructure","We have a specific project or problem to solve","We're curious about AI and what's possible","Honestly, not sure yet — open to learning","Other"],key:'intent',hasOther:true},
  {id:'onaws',bot:"Are you currently using AWS?",type:'choice',opts:["Yes, we're already on AWS","We're using another cloud provider","No, we're not on any cloud yet","Not sure"],key:'onaws'},
  {id:'context',bot:a=>Q2B[a.intent]?Q2B[a.intent].q:null,type:'dynamic',opts:a=>Q2B[a.intent]?Q2B[a.intent].opts:[],key:'context',hasOther:true},
  {id:'focus',bot:"What should we focus on during our meeting? Pick up to 2.",type:'multi',max:2,opts:["Costs and pricing — be transparent","Security and data protection","Reliability and performance at scale","Ease of adoption and getting started","Data residency and compliance","Ongoing expert support","Other"],key:'focus'},
  {id:'attendees',bot:"Who will be joining from your side?",type:'choice',opts:["Just me — I have a technical background","Just me — I have a business background","A technical team (engineers, architects)","Business stakeholders (leadership, finance)","Mixed group — technical and business together","Other"],key:'attendees',hasOther:true}
];

function activeQs(){return QS;}
const $=id=>document.getElementById(id);

// ═══ DOM ═══
function addMsg(s,h){const r=document.createElement('div');r.className='msg '+s;const i=s==='bot'?'<div class="ico"><i class="fa-brands fa-aws"></i></div>':'<div class="ico"><i class="fa-solid fa-user"></i></div>';r.innerHTML=s==='bot'?i+'<div class="bubble">'+h.replace(/\n/g,'<br>')+'</div>':'<div class="bubble">'+h.replace(/\n/g,'<br>')+'</div>'+i;$('chat-msgs').appendChild(r);r.scrollIntoView({block:'end',behavior:'smooth'});}
function showT(){const r=document.createElement('div');r.id='typ';r.className='typing-wrap';r.innerHTML='<div class="ico" style="width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#FF9900,#e05c00);display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff"><i class="fa-brands fa-aws"></i></div><div class="typing-dots"><span></span><span></span><span></span></div>';$('chat-msgs').appendChild(r);r.scrollIntoView({block:'end',behavior:'smooth'});}
function hideT(){const t=$('typ');if(t)t.remove();}
function hideC(){const c=$('choices');c.style.display='none';c.innerHTML='';multiSel=[];$('input-row').style.display='none';$('text-in').value='';$('text-in').disabled=false;$('send-btn').disabled=false;}
function setProg(n,t){$('prog-fill').style.width=(t>0?Math.round(n/t*100):0)+'%';$('prog-count').textContent=n>0?n+'/'+t:'';$('prog-label').textContent=n===0?'Ready to start':n>=t?'All done!':'Question '+n+' of '+t;}
function wait(ms){return new Promise(r=>setTimeout(r,ms));}

// ═══ FLOW ═══
async function ask(idx){
  const qs=activeQs();
  if(idx>=qs.length){await finish();return;}
  const q=qs[idx];
  if(q.id==='intent'&&answers.welcome==="I'll share my priorities in the meeting"){await finish();return;}

  // Determine ack based on PREVIOUS question
  let ack = '';
  if(idx > 0){
    const prevQ = qs[idx-1];
    if(prevQ.id==='welcome') ack = ACKS_AFTER.welcome;
    else if(prevQ.id==='intent') ack = INTENT_ACKS[answers.intent] || "Thanks for sharing that.";
    else if(prevQ.id==='onaws') ack = ACKS_AFTER.onaws;
    else if(prevQ.id==='context') ack = ACKS_AFTER.context;
    else if(prevQ.id==='focus') ack = ACKS_AFTER.focus;
  }

  showT();await wait(750);hideT();
  const txt=typeof q.bot==='function'?q.bot(answers):q.bot;
  if(!txt){current++;ask(current);return;}
  const fullMsg = ack ? ack + ' ' + txt : txt;
  addMsg('bot',fullMsg);
  await wait(200);
  if(q.type==='choice'||q.type==='dynamic'||q.type==='multi')renderC(q,q.type==='multi');
}

function renderC(q,m){
  const c=$('choices');c.innerHTML='';multiSel=[];
  if(m){const h=document.createElement('div');h.className='ch-hint';h.textContent=q.max?'Select up to '+q.max+', then confirm':'Select all that apply';c.appendChild(h);}
  const opts=typeof q.opts==='function'?q.opts(answers):q.opts;
  opts.forEach(o=>{const b=document.createElement('button');b.className='ch-btn';b.textContent=o;b.addEventListener('click',()=>hC(q,o,b,m));c.appendChild(b);});
  if(m){const cf=document.createElement('button');cf.id='mc';cf.className='ch-btn sel';cf.style.cssText='background:#232f3e;border-color:#232f3e;color:#fff;width:100%;margin-top:2px';cf.textContent='Confirm →';cf.addEventListener('click',()=>{if(!multiSel.length)multiSel.push('No preference');doSub(q,multiSel.join(', '));});c.appendChild(cf);}
  c.style.display='flex';
}

function hC(q,o,b,m){
  if(!m){
    // "Other" — focus the text input instead of submitting
    if(q.hasOther && o==='Other'){
      b.classList.add('sel');
      $('input-row').style.display='flex';
      $('text-in').placeholder='Type here...';
      $('text-in').focus();
      return;
    }
    b.classList.add('sel');$('choices').querySelectorAll('.ch-btn').forEach(x=>{if(x!==b)x.disabled=true;});setTimeout(()=>doSub(q,o),280);
  } else{if(b.classList.contains('sel')){b.classList.remove('sel');multiSel=multiSel.filter(s=>s!==o);}else{if(q.max&&multiSel.length>=q.max){const old=multiSel.shift();$('choices').querySelectorAll('.ch-btn').forEach(x=>{if(x.textContent===old)x.classList.remove('sel');});}b.classList.add('sel');multiSel.push(o);}}
}

async function doSub(q,v){
  hideC();answers[q.key]=v;addMsg('user',v);
  current++;setProg(current,activeQs().length);
  ask(current);
}

function submitText(){
  const v=$('text-in').value.trim();if(!v)return;
  const qs=activeQs();const q=qs[current];if(!q)return;
  if(q.type==='multi'){const b=document.createElement('button');b.className='ch-btn sel';b.textContent=v;b.addEventListener('click',()=>{b.classList.remove('sel');multiSel=multiSel.filter(s=>s!==v);b.remove();});if(q.max&&multiSel.length>=q.max){const old=multiSel.shift();$('choices').querySelectorAll('.ch-btn:not(#mc)').forEach(x=>{if(x.textContent===old)x.classList.remove('sel');});}multiSel.push(v);$('choices').insertBefore(b,$('mc'));$('text-in').value='';$('text-in').focus();return;}
  hideC();doSub(q,v);
}
$('text-in').addEventListener('keydown',e=>{if(e.key==='Enter')submitText();});

function doSkip(){skipped=true;hideC();$('input-row').style.display='none';const skip=$('skip-link');if(skip)skip.style.display='none';showT();setTimeout(()=>{hideT();addMsg('bot','No problem at all. The team looks forward to meeting you.');},1000);}

function showRes(res){const w=document.createElement('div');w.className='res-cards';res.forEach(r=>{const a=document.createElement('a');a.className='res-card';a.href=r.url;a.target='_blank';a.rel='noopener';a.innerHTML='<div class="ri"><i class="'+r.icon+'"></i></div><div class="rb"><div class="rl">'+r.label+'</div><div class="rt">'+r.title+'</div><div class="rd">'+r.desc+'</div></div><div class="ra"><i class="fa-solid fa-arrow-up-right-from-square"></i></div>';w.appendChild(a);});$('chat-msgs').appendChild(w);w.scrollIntoView({block:'end',behavior:'smooth'});}

async function finish(){
  hideC();$('text-in').disabled=true;$('text-in').placeholder='All done!';$('send-btn').disabled=true;
  showT();await wait(1000);hideT();
  if(skipped){
    addMsg('bot','No problem at all. The team looks forward to meeting you.');
  } else {
    addMsg('bot',"Got it. Here are a few resources tailored to your priorities — take a look before the meeting:");
    await wait(400);
    const res=getRes();
    if(res.length) showRes(res);
    await wait(600);
    addMsg('bot',"You're all set. We'll be well prepared for our conversation. See you soon.");
  }
}

// ═══ RESOURCES ═══
function getRes(){
  const i=answers.intent||'',c=answers.context||'',f=answers.focus||'',res=[];

  // Migration / evaluating alternatives
  if(i.includes('evaluating alternatives')||c.includes('on-premises')||c.includes('Azure')||c.includes('Google')||c.includes('mix')){
    res.push({icon:'fa-solid fa-truck-moving',label:'Migration',title:'AWS Migration Acceleration Program (MAP)',desc:'How AWS reduces migration risk with expert guidance and funding support.',url:'https://aws.amazon.com/migration-acceleration-program/'});
    res.push({icon:'fa-solid fa-play-circle',label:'Customer Story',title:'Volkswagen Group — 6-month cloud migration',desc:'How VW migrated at scale: governance, speed, and team enablement.',url:'https://aws.amazon.com/blogs/industries/volkswagen-group-three-success-factors-for-6-month-cloud-migration/'});
    if(c.includes('Azure')||c.includes('Google'))
      res.push({icon:'fa-solid fa-scale-balanced',label:'Comparison',title:'AWS Total Cost of Ownership Calculator',desc:'Compare your current infrastructure cost against AWS.',url:'https://aws.amazon.com/tco-calculator/'});
  }

  // AI
  if(i.includes('AI')||i.includes('curious about AI')||c.includes('scale')||c.includes('idea')||c.includes('experimenting')){
    res.push({icon:'fa-solid fa-robot',label:'Generative AI',title:'Amazon Bedrock — Build with foundation models',desc:'Access leading AI models, build applications, and deploy responsibly.',url:'https://aws.amazon.com/bedrock/'});
    res.push({icon:'fa-solid fa-play-circle',label:'Customer Story',title:'Pfizer — Accelerating drug discovery with AI on AWS',desc:'How Pfizer saved 16,000 scientist hours and cut costs 55%.',url:'https://aws.amazon.com/solutions/case-studies/pfizer-PACT-case-study/'});
  }

  // Specific project
  if(i.includes('project')||i.includes('problem to solve')){
    if(c.includes('Data')||c.includes('analytics'))
      res.push({icon:'fa-solid fa-chart-bar',label:'Data & Analytics',title:'Goldman Sachs — Cloud-native data analytics on AWS',desc:'How Goldman Sachs built scalable, governed analytics in the cloud.',url:'https://aws.amazon.com/solutions/case-studies/goldman-sachs-data-video-case-study/'});
    if(c.includes('Security')||c.includes('compliance'))
      res.push({icon:'fa-solid fa-shield-halved',label:'Security',title:'Goldman Sachs — Secure access management on AWS',desc:'Managing security across thousands of interconnected accounts.',url:'https://aws.amazon.com/solutions/case-studies/goldman-sachs-security-case-study/'});
    if(c.includes('Cost'))
      res.push({icon:'fa-solid fa-coins',label:'Cost Optimisation',title:'Airbnb — Saving $63M with AWS cost management',desc:'Savings Plans, intelligent storage, and capacity optimisation.',url:'https://aws.amazon.com/solutions/case-studies/airbnb-optimizes-usage-and-costs-case-study/'});
    if(c.includes('App')||c.includes('website')||c.includes('modernis'))
      res.push({icon:'fa-solid fa-layer-group',label:'Modernisation',title:'Application Modernisation on AWS',desc:'Strategies for moving legacy applications to cloud-native.',url:'https://aws.amazon.com/application-modernization/'});
  }

  // Industry (from Q2 when they picked industry)
  if(c.includes('Financial'))
    res.push({icon:'fa-solid fa-landmark',label:'Financial Services',title:'Goldman Sachs — Transaction banking on AWS',desc:'Security, compliance, and new business lines at scale.',url:'https://aws.amazon.com/solutions/case-studies/goldman-sachs-security-case-study/'});
  if(c.includes('Healthcare')||c.includes('Life Sciences'))
    res.push({icon:'fa-solid fa-heart-pulse',label:'Healthcare',title:'Pfizer — Generative AI for drug discovery',desc:'Accelerating research with Amazon Bedrock and SageMaker.',url:'https://aws.amazon.com/solutions/case-studies/pfizer-PACT-case-study/'});
  if(c.includes('Retail')||c.includes('E-commerce'))
    res.push({icon:'fa-solid fa-bag-shopping',label:'Retail',title:'Airbnb — Scaling a global marketplace on AWS',desc:'Global demand, reliability, and cost control.',url:'https://aws.amazon.com/solutions/case-studies/airbnb-case-study/'});
  if(c.includes('Manufacturing'))
    res.push({icon:'fa-solid fa-industry',label:'Manufacturing',title:'Siemens — Industrial IoT on AWS',desc:'Real-time factory monitoring with AWS IoT SiteWise.',url:'https://aws.amazon.com/solutions/case-studies/siemens-mindsphere/'});
  if(c.includes('Technology')||c.includes('SaaS'))
    res.push({icon:'fa-solid fa-microchip',label:'Technology',title:'Airbnb — Cost optimisation at global scale',desc:'How a SaaS company cut $63M while scaling worldwide.',url:'https://aws.amazon.com/solutions/case-studies/airbnb-optimizes-usage-and-costs-case-study/'});
  if(c.includes('Public Sector'))
    res.push({icon:'fa-solid fa-building-columns',label:'Public Sector',title:'AWS for Government and Public Sector',desc:'Sovereign cloud, compliance, and digital transformation.',url:'https://aws.amazon.com/government-education/'});

  // Fallback
  if(!res.length){
    res.push({icon:'fa-brands fa-aws',label:'Overview',title:'What is AWS?',desc:'A clear overview of AWS services and how companies use them.',url:'https://aws.amazon.com/what-is-aws/'});
    res.push({icon:'fa-solid fa-play-circle',label:'Customer Stories',title:'AWS Customer Case Studies',desc:'Real examples across industries.',url:'https://aws.amazon.com/solutions/case-studies/'});
  }
  return res.slice(0,3);
}

// ═══ INIT ═══
setProg(0,activeQs().length);
ask(0);
</script>
</body>
</html>
